name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Build (Next.js)
        working-directory: apps/web
        env:
          VERCEL: ''
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_SUPABASE_URL: https://nvpaggacvbotgqyxfdof.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cGFnZ2FjdmJvdGdxeXhmZG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTMyNzAsImV4cCI6MjA5MTI4OTI3MH0.CjVrOqtV38mwGpcgxHbWgAP70SgVSXymmD4CKx0IkVo
        run: pnpm build

      - name: Build (next-on-pages)
        working-directory: apps/web
        env:
          VERCEL: ''
          # next-on-pages는 내부적으로 앱을 다시 빌드한다. 여기에 값을 넘기지 않으면
          # next.config.ts의 fallback이 쓰이면서 클라이언트 번들이 엉뚱한 DB로 고정된다.
          NEXT_PUBLIC_SUPABASE_URL: https://nvpaggacvbotgqyxfdof.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cGFnZ2FjdmJvdGdxeXhmZG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTMyNzAsImV4cCI6MjA5MTI4OTI3MH0.CjVrOqtV38mwGpcgxHbWgAP70SgVSXymmD4CKx0IkVo
        run: pnpm dlx @cloudflare/next-on-pages@1.13.16

      - name: Fix bracket-path static chunks (CF Pages cannot serve [bracket] directories)
        working-directory: apps/web
        run: |
          python3 << 'PYEOF'
          import os, shutil

          next_static = '.vercel/output/static/_next/static'
          worker_dir = '.vercel/output/static/_worker.js'

          # Find all files in [bracket] directories under _next/static
          bracket_chunks = []
          for root, dirs, files in os.walk(next_static):
              for f in files:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, next_static).replace(os.sep, '/')
                  if '[' in rel or ']' in rel:
                      bracket_chunks.append((full, rel))

          if not bracket_chunks:
              print('No bracket-path files found - skipping')
          else:
              print(f'Found {len(bracket_chunks)} bracket-path files')

              # Step 1: Copy to debracketized paths
              for src, rel in bracket_chunks:
                  new_rel = rel.replace('[', '').replace(']', '')
                  dst = os.path.join(next_static, new_rel)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  shutil.copy2(src, dst)
                  print(f'Copied: {rel} -> {new_rel}')

              # Step 2: Patch JS/JSON files in BOTH _next/static AND _worker.js
              # _worker.js contains RSC chunk registrations that reference [bracket] paths
              # Browser uses these URLs; CDN has poisoned text/plain for old bracket hashes
              # Replacing [bracket] with bracket-less path means browser requests unpoisoned URL
              patched_files = 0
              search_dirs = [next_static, worker_dir]
              for search_dir in search_dirs:
                  if not os.path.isdir(search_dir):
                      continue
                  for root, dirs, files in os.walk(search_dir):
                      for f in files:
                          if not (f.endswith('.js') or f.endswith('.json')):
                              continue
                          full = os.path.join(root, f)
                          rel_full = os.path.relpath(full, search_dir).replace(os.sep, '/')
                          # In _next/static, skip the bracket-path source chunks themselves
                          # In _worker.js, do NOT skip .func.js files even if their path has brackets
                          # (e.g. admin/orders/[batchId].func.js contains the RSC manifest)
                          if '[' in rel_full and search_dir == next_static:
                              continue
                          try:
                              content = open(full, encoding='utf-8').read()
                          except Exception:
                              continue
                          new_content = content
                          for _, chunk_rel in bracket_chunks:
                              # chunk_rel = "chunks/app/.../[x]/page-hash.js"
                              debracketed = chunk_rel.replace('[', '').replace(']', '')
                              # URL-encoded versions: webpack runtime stores bracket paths as %5B/%5D
                              chunk_enc = chunk_rel.replace('[', '%5B').replace(']', '%5D')
                              chunk_enc_lc = chunk_rel.replace('[', '%5b').replace(']', '%5d')

                              # Build all pattern variants to search (literal + URL-encoded)
                              variants = [
                                  (chunk_rel, debracketed),
                                  (chunk_enc, debracketed),
                                  (chunk_enc_lc, debracketed),
                                  ('static/' + chunk_rel, 'static/' + debracketed),
                                  ('static/' + chunk_enc, 'static/' + debracketed),
                              ]
                              if chunk_rel.startswith('chunks/'):
                                  after = chunk_rel[len('chunks/'):]
                                  after_d = debracketed[len('chunks/'):]
                                  after_enc = chunk_enc[len('chunks/'):]
                                  after_enc_lc = chunk_enc_lc[len('chunks/'):]
                                  variants += [
                                      (after, after_d),
                                      (after_enc, after_d),
                                      (after_enc_lc, after_d),
                                  ]
                                  if after.endswith('.js'):
                                      no_ext = after[:-3]
                                      no_ext_d = after_d[:-3]
                                      variants += [
                                          (no_ext, no_ext_d),
                                          (after_enc[:-3], no_ext_d),
                                          (after_enc_lc[:-3], no_ext_d),
                                      ]

                              for pattern, replacement in variants:
                                  if pattern in new_content:
                                      new_content = new_content.replace(pattern, replacement)
                                      print(f'  replaced: {pattern[:60]} -> {replacement[:60]}')
                          if new_content != content:
                              open(full, 'w', encoding='utf-8').write(new_content)
                              patched_files += 1
                              print(f'Patched: {os.path.basename(search_dir)}/{rel_full}')

              print(f'Done: copied {len(bracket_chunks)} bracket files, patched {patched_files} files')
          PYEOF

      - name: Fix worker index.js (next-on-pages bug - root / mapped to favicon)
        working-directory: apps/web
        run: |
          python3 << 'PYEOF'
          import re
          path = '.vercel/output/static/_worker.js/index.js'
          content = open(path).read()
          WRONG = '"/":{type:"override",path:"/favicon.ico",headers:{"content-type":"image/x-icon"}}'
          RIGHT = '"/":{type:"function",entrypoint:"__next-on-pages-dist__/functions/index.func.js"}'
          if WRONG in content:
              open(path, 'w').write(content.replace(WRONG, RIGHT))
              print('SUCCESS: patched / route to index.func.js')
          else:
              print('WARNING: pattern not found - checking worker content...')
              import re
              m = re.search(r'"/":\{[^}]+\}', content)
              if m: print('Current / mapping:', m.group())
          PYEOF

      - name: Set CF Pages project config (production branch + Supabase Seoul)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/fruitlife"

          show() {
            curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | python3 -c "
          import sys, json
          r = json.load(sys.stdin)['result']
          print('  production_branch =', r.get('production_branch'))
          e = r['deployment_configs']['production'].get('env_vars') or {}
          for k, v in sorted(e.items()):
              print(f'  {k} = {(v or {}).get(\"value\") or \"(secret)\"}')
          "
          }

          echo "── 변경 전 ──"; show

          # production_branch가 아래 deploy 스텝의 --branch 값과 다르면 CF는 그 배포를
          # preview로 취급한다. 그러면 워크플로는 성공하는데 운영 도메인은 옛 배포를
          # 계속 서빙한다 (2026-07-26 확인된 실제 원인).
          #
          # env_vars는 대시보드 런타임 값이 build-time 값을 override하므로 여기서 Seoul로 못박는다.
          # 키 단위 merge라 SUPABASE_SERVICE_ROLE_KEY 등 나머지는 건드리지 않는다.
          curl -sf -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" "$API" -d '{
              "production_branch": "main",
              "deployment_configs": {
                "production": {
                  "env_vars": {
                    "NEXT_PUBLIC_SUPABASE_URL": {"type": "plain_text", "value": "https://nvpaggacvbotgqyxfdof.supabase.co"},
                    "NEXT_PUBLIC_SUPABASE_ANON_KEY": {"type": "plain_text", "value": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cGFnZ2FjdmJvdGdxeXhmZG9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MTMyNzAsImV4cCI6MjA5MTI4OTI3MH0.CjVrOqtV38mwGpcgxHbWgAP70SgVSXymmD4CKx0IkVo"}
                  }
                }
              }
            }' > /dev/null

          echo "── 변경 후 ──"; show

      - name: Set CF Pages secrets (service role key)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52cGFnZ2FjdmJvdGdxeXhmZG9mIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NTcxMzI3MCwiZXhwIjoyMDkxMjg5MjcwfQ.XQHl-sDQQPT8Jnsld3-SCNuV2WZeTxxP2BFFohxp6Ic" | pnpm dlx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY --project-name fruitlife

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler pages deploy .vercel/output/static --project-name fruitlife --branch main

      - name: Purge Cloudflare CDN cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 이 스텝은 2026-07-26 이전까지 매번 IndexError로 죽고 있었다.
          # 토큰에 Zone:Read 권한이 없거나 zone 이름이 안 맞으면 result가 빈 배열이 되는데
          # [0]을 그냥 인덱싱해서 터졌다. 캐시가 안 비워지면 새 배포가 가려질 수 있으므로
          # 실패 원인을 로그에 남기도록 바꾼다.
          ZONE=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=fruitlife.shop" | \
            python3 -c "import sys,json; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")

          if [ -z "$ZONE" ]; then
            echo "::warning::fruitlife.shop zone을 찾지 못했습니다. CDN 캐시를 비우지 못했습니다."
            echo "  → CLOUDFLARE_API_TOKEN에 Zone:Read + Cache Purge 권한이 있는지 확인하세요."
            exit 0
          fi

          echo "Zone: $ZONE"
          RES=$(curl -sf -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -d '{"purge_everything":true}')
          echo "Purge result: $RES"

      - name: Verify production (배포 성공 ≠ 사이트 정상)
        run: |
          # 2026-07-28: 배포는 success 인데 워커가 죽어 전 경로가 503 이었다.
          # 워크플로 결과만 보고 넘어가면 장애를 모른 채 지나간다. 실제 응답을 확인한다.
          BASE=https://order.fruitlife.shop
          sleep 20

          FAILED=0
          for P in /login /admin/dashboard /admin/orders /admin/products /admin/settlement; do
            CODE=""
            for TRY in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$BASE$P" || echo 000)
              case "$CODE" in 2*|3*) break ;; esac
              sleep 10
            done
            echo "  $P → $CODE"
            case "$CODE" in
              2*|3*) ;;
              *) echo "::error::$P 가 $CODE 를 반환했습니다"; FAILED=1 ;;
            esac
          done

          if [ "$FAILED" = "1" ]; then
            echo "배포는 됐지만 운영이 정상 응답하지 않습니다. 롤백이 필요합니다."
            exit 1
          fi
          echo "운영 정상 확인"

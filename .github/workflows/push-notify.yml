name: Push Notification Sender

on:
  schedule:
    # GitHub schedules may be delayed; the API catches up today's due schedules.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: push-notification-sender
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notifications
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://order.fruitlife.shop/api/admin/push/send \
            -H "Authorization: Bearer ${{ secrets.PUSH_CRON_SECRET }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "Response: $BODY"
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            exit 1
          fi
